<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - ZIZZ Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#07070b;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:400px;
    background:#111118;
    border:1px solid #252532;
    border-radius:20px;
    padding:28px;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.logo span{
    color:#7c5cff;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-bottom:25px;
}

label{
    display:block;
    margin:15px 0 7px;
    color:#ddd;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #30303d;
    background:#08080d;
    color:white;
    outline:none;
}

input:focus{
    border-color:#7c5cff;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    margin-top:18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.login{
    background:#7c5cff;
    color:white;
}

.google{
    background:white;
    color:#111;
}

.or{
    text-align:center;
    color:#777;
    margin:20px 0;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#181820;
    color:#bbb;
    font-size:14px;
    display:none;
}

.bottom{
    text-align:center;
    margin-top:20px;
    color:#888;
    font-size:14px;
}

.bottom a{
    color:#8b70ff;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">
        ZIZZ<span>Wallet</span>
    </div>

    <div class="subtitle">
        Login to your wallet
    </div>

    <label>Gmail / Email</label>

    <input
        id="email"
        type="email"
        placeholder="example@gmail.com"
    >

    <label>Password</label>

    <input
        id="password"
        type="password"
        placeholder="Your password"
    >

    <button class="login" onclick="login()">
        Login
    </button>

    <div class="or">OR</div>

    <button class="google" onclick="googleLogin()">
        Continue with Google
    </button>

    <div id="message" class="message"></div>

    <div class="bottom">
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </div>

</div>

<script>

const SUPABASE_URL =
"https://dwipyqihaxcdpahzirpb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OekqwQUbrFPSNhHn-w-K4g_hnUmxOeD";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


function showMessage(text){

    const box =
        document.getElementById("message");

    box.innerText = text;

    box.style.display = "block";
}


async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if(!email || !password){

        showMessage("Enter email and password.");

        return;
    }


    showMessage("Logging in...");


    const { data, error } =
        await db.auth.signInWithPassword({

            email:email,

            password:password

        });


    if(error){

        showMessage(error.message);

        return;
    }


    window.location.href =
        "../dashboard.html";
}


async function googleLogin(){

    showMessage("Opening Google login...");


    const { error } =
        await db.auth.signInWithOAuth({

            provider:"google"

        });


    if(error){

        showMessage(error.message);

    }
}

</script>

</body>
</html>
