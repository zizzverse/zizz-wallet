<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZIZZ Wallet - Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;
            background: #06110d;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .container {
            width: 100%;
            max-width: 420px;
        }


        .logo {
            width: 82px;
            height: 82px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #e5c15d,
                    #9b711f
                );

            color: #06110d;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 48px;
            font-weight: bold;

            box-shadow:
                0 0 35px
                rgba(216,180,90,.25);
        }


        h1 {
            text-align: center;
            font-size: 28px;
        }


        .subtitle {
            text-align: center;

            color: #91a59b;

            margin-top: 8px;
            margin-bottom: 30px;
        }


        .card {
            background: #0d1b15;

            border: 1px solid #20382c;

            border-radius: 23px;

            padding: 25px;
        }


        .google-btn {
            width: 100%;
            height: 56px;

            border-radius: 14px;

            border: 1px solid #395247;

            background: white;

            color: #111;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;
        }


        .google-icon {
            font-size: 22px;
            font-weight: bold;
        }


        .google-btn:disabled {
            opacity: .6;
        }


        .message {
            display: none;

            margin-top: 16px;

            padding: 13px;

            border-radius: 12px;

            background: #13271d;

            border: 1px solid #294437;

            color: #b9d6c5;

            font-size: 13px;

            line-height: 1.5;
        }


        .signup {
            text-align: center;

            color: #879a91;

            margin-top: 24px;

            font-size: 14px;
        }


        .signup span {
            color: #d8b45a;

            cursor: pointer;
        }


        .bd {
            text-align: center;

            margin-top: 23px;

            color: #71867c;

            font-size: 13px;
        }


        .flag {
            display: inline-block;

            width: 22px;
            height: 14px;

            background: #006a4e;

            position: relative;

            margin-right: 5px;

            vertical-align: -2px;
        }


        .flag::after {
            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            background: #f42a41;

            border-radius: 50%;

            left: 7px;
            top: 3px;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        Z
    </div>


    <h1>
        ZIZZ Wallet
    </h1>


    <p class="subtitle">
        Secure your digital ZIZZ Coins
    </p>


    <div class="card">


        <button
            class="google-btn"
            id="googleBtn"
            onclick="loginWithGoogle()"
        >

            <span class="google-icon">
                G
            </span>

            Continue with Google

        </button>


        <div
            class="message"
            id="message"
        ></div>


        <div class="signup">

            Don't have an account?

            <span onclick="goSignup()">
                Create Account
            </span>

        </div>


    </div>


    <div class="bd">

        <span class="flag"></span>

        Bangladesh

    </div>


</div>



<script>


const SUPABASE_URL =
    "https://dvipyqihaxcdpahzipb.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_OekqwQUbrFPSNhHn-w-K4g_hnUmxOeD";


const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



async function loginWithGoogle() {


    const button =
        document.getElementById(
            "googleBtn"
        );


    const message =
        document.getElementById(
            "message"
        );


    button.disabled = true;

    button.textContent =
        "Opening Google...";


    message.style.display =
        "block";

    message.textContent =
        "Connecting to Google...";


    const {
        error
    } =
        await db.auth.signInWithOAuth({

            provider: "google",

            options: {

                redirectTo:
                    "https://zizzverse.github.io/zizz-wallet/dashboard.html"

            }

        });


    if (error) {

        message.textContent =
            error.message;

        button.disabled = false;

        button.innerHTML =
            '<span class="google-icon">G</span> Continue with Google';

    }

}



function goSignup() {

    window.location.href =
        "signup.html";

}


</script>


</body>

</html>
