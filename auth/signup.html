<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZIZZ Wallet - Create Account</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #06110d;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: linear-gradient(145deg, #d8b45a, #8d671c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 43px;
            font-weight: bold;
            color: #06110d;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #91a59b;
            margin-bottom: 25px;
        }

        .card {
            background: #0d1b15;
            border: 1px solid #1d3429;
            border-radius: 22px;
            padding: 24px;
        }

        label {
            display: block;
            color: #b9c8c0;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 50px;
            background: #07130e;
            border: 1px solid #294437;
            border-radius: 13px;
            color: white;
            padding: 0 15px;
            font-size: 15px;
            outline: none;
            margin-bottom: 16px;
        }

        input:focus {
            border-color: #d8b45a;
        }

        .create-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #d8b45a, #a87d24);
            color: #08100c;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-btn:disabled {
            opacity: 0.6;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #8fa198;
            font-size: 14px;
        }

        .login span {
            color: #d8b45a;
            cursor: pointer;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #13271d;
            color: #b9d6c5;
            font-size: 13px;
            line-height: 1.5;
        }

        .bd {
            text-align: center;
            margin-top: 22px;
            color: #71867c;
            font-size: 13px;
        }

        .flag {
            display: inline-block;
            width: 22px;
            height: 14px;
            background: #006a4e;
            position: relative;
            margin-right: 5px;
            vertical-align: -2px;
        }

        .flag::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: #f42a41;
            border-radius: 50%;
            left: 7px;
            top: 3px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">Z</div>

    <h1>Create ZIZZ Wallet</h1>

    <p class="subtitle">
        Create your secure wallet account
    </p>

    <div class="card">

        <label>Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
        >

        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="+8801XXXXXXXXX"
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Minimum 6 characters"
        >

        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
        >

        <button
            class="create-btn"
            id="createBtn"
            onclick="createAccount()"
        >
            Create Account
        </button>

        <div
            class="message"
            id="message"
        ></div>

        <div class="login">
            Already have an account?
            <span onclick="goLogin()">
                Login
            </span>
        </div>

    </div>

    <div class="bd">
        <span class="flag"></span>
        Bangladesh
    </div>

</div>


<script>

const SUPABASE_URL =
    "https://dvipyqihaxcdpahzipb.supabase.co";

const SUPABASE_KEY =
    "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


const { createClient } =
    supabase;

const db =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


function showMessage(text) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.style.display = "block";
}


async function createAccount() {

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const button =
        document.getElementById("createBtn");


    if (
        name === "" ||
        phone === "" ||
        password === "" ||
        confirmPassword === ""
    ) {

        showMessage(
            "Please fill in all fields."
        );

        return;
    }


    if (password.length < 6) {

        showMessage(
            "Password must be at least 6 characters."
        );

        return;
    }


    if (password !== confirmPassword) {

        showMessage(
            "Passwords do not match."
        );

        return;
    }


    if (
        !phone.startsWith("+880") ||
        phone.length < 14
    ) {

        showMessage(
            "Enter your Bangladesh phone number like +8801XXXXXXXXX"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "Creating Account...";


    try {

        const { data, error } =
            await db.auth.signUp({

                phone: phone,

                password: password,

                options: {

                    data: {
                        full_name: name
                    }

                }

            });


        if (error) {

            showMessage(
                error.message
            );

            button.disabled = false;

            button.textContent =
                "Create Account";

            return;
        }


        /*
         * Supabase phone authentication
         * normally requires OTP verification.
         */

        if (data.user) {

            showMessage(
                "Account created! Check your phone for the verification code."
            );

        }


    } catch (error) {

        showMessage(
            "Something went wrong. Please try again."
        );

    }


    button.disabled = false;

    button.textContent =
        "Create Account";
}


function goLogin() {

    window.location.href =
        "login.html";

}

</script>

</body>
</html>
