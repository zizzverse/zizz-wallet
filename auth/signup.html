<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZIZZ Wallet - Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #06110d;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: linear-gradient(145deg, #d8b45a, #8d671c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 43px;
            font-weight: bold;
            color: #06110d;
            box-shadow: 0 0 30px rgba(216,180,90,.25);
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #91a59b;
            margin-bottom: 25px;
        }

        .card {
            background: #0d1b15;
            border: 1px solid #1d3429;
            border-radius: 22px;
            padding: 24px;
        }

        label {
            display: block;
            color: #b9c8c0;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 50px;
            background: #07130e;
            border: 1px solid #294437;
            border-radius: 13px;
            color: white;
            padding: 0 15px;
            font-size: 15px;
            outline: none;
            margin-bottom: 16px;
        }

        input:focus {
            border-color: #d8b45a;
        }

        .create-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #d8b45a, #a87d24);
            color: #08100c;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .google-btn {
            width: 100%;
            height: 52px;
            border-radius: 13px;
            border: 1px solid #30483c;
            background: #101f18;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #8fa198;
            font-size: 14px;
        }

        .login span {
            color: #d8b45a;
            cursor: pointer;
        }

        .wallet-id {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 13px;
            background: #07130e;
            border: 1px solid #294437;
        }

        .wallet-id small {
            color: #879a91;
        }

        .wallet-id strong {
            display: block;
            color: #d8b45a;
            margin-top: 5px;
            word-break: break-all;
        }

        .bd {
            text-align: center;
            margin-top: 22px;
            color: #71867c;
            font-size: 13px;
        }

        .flag {
            display: inline-block;
            width: 22px;
            height: 14px;
            background: #006a4e;
            position: relative;
            margin-right: 5px;
            vertical-align: -2px;
        }

        .flag::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: #f42a41;
            border-radius: 50%;
            left: 7px;
            top: 3px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">Z</div>

    <h1>Create ZIZZ Wallet</h1>

    <p class="subtitle">
        Create your secure wallet account
    </p>

    <div class="card">

        <label>Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
        >

        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="+880 1XXXXXXXXX"
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Create password"
        >

        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
        >

        <button class="create-btn" onclick="createAccount()">
            Create Account
        </button>

        <button class="google-btn" onclick="googleSignup()">
            🔵 Continue with Google
        </button>

        <div class="wallet-id" id="walletBox">

            <small>Your ZIZZ Wallet ID</small>

            <strong id="walletId"></strong>

        </div>

        <div class="login">
            Already have an account?
            <span onclick="goLogin()">
                Login
            </span>
        </div>

    </div>

    <div class="bd">
        <span class="flag"></span>
        Bangladesh
    </div>

</div>


<script>

function createAccount() {

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (name === "" ||
        phone === "" ||
        password === "" ||
        confirmPassword === "") {

        alert("Please fill in all fields.");
        return;
    }


    if (password.length < 6) {

        alert("Password must be at least 6 characters.");
        return;
    }


    if (password !== confirmPassword) {

        alert("Passwords do not match.");
        return;
    }


    const walletId =
        "ZIZZ-" +
        Math.random()
        .toString(36)
        .substring(2, 10)
        .toUpperCase();


    document.getElementById("walletId").textContent =
        walletId;

    document.getElementById("walletBox").style.display =
        "block";


    alert(
        "Account created successfully!\n\n" +
        "Your Wallet ID: " + walletId
    );
}


function googleSignup() {

    alert(
        "Google Sign Up will be connected later."
    );

}


function goLogin() {

    window.location.href = "login.html";

}

</script>

</body>
</html>
