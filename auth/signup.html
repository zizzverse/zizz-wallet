<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZIZZ Wallet - Create Account</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #06110d;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(145deg, #d8b45a, #8d671c);
            color: #06110d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
            box-shadow: 0 0 35px rgba(216,180,90,.25);
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 7px;
        }

        .subtitle {
            text-align: center;
            color: #91a59b;
            margin-bottom: 28px;
        }

        .card {
            background: #0d1b15;
            border: 1px solid #1d3429;
            border-radius: 22px;
            padding: 25px;
        }

        .google-btn {
            width: 100%;
            height: 54px;
            border: 1px solid #395247;
            border-radius: 14px;
            background: #ffffff;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-icon {
            font-size: 21px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #687d73;
            font-size: 13px;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #263b31;
            flex: 1;
        }

        .info {
            background: #07130e;
            border: 1px solid #243c30;
            border-radius: 14px;
            padding: 15px;
            color: #91a59b;
            font-size: 13px;
            line-height: 1.6;
        }

        .info strong {
            color: #d8b45a;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #13271d;
            color: #b9d6c5;
            font-size: 13px;
            line-height: 1.5;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #8fa198;
            font-size: 14px;
        }

        .login span {
            color: #d8b45a;
            cursor: pointer;
        }

        .bd {
            text-align: center;
            margin-top: 23px;
            color: #71867c;
            font-size: 13px;
        }

        .flag {
            display: inline-block;
            width: 22px;
            height: 14px;
            background: #006a4e;
            position: relative;
            margin-right: 5px;
            vertical-align: -2px;
        }

        .flag::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: #f42a41;
            border-radius: 50%;
            left: 7px;
            top: 3px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">Z</div>

    <h1>Create ZIZZ Wallet</h1>

    <p class="subtitle">
        Your secure ZIZZ Coin wallet
    </p>

    <div class="card">

        <button
            class="google-btn"
            onclick="continueWithGoogle()"
        >
            <span class="google-icon">G</span>
            Continue with Google
        </button>


        <div class="divider">
            OR
        </div>


        <div class="info">

            <strong>How it works</strong>
            <br><br>

            1. Sign in with your Google account.
            <br>

            2. Your ZIZZ Wallet account is created automatically.
            <br>

            3. A unique Wallet ID is generated.
            <br>

            4. Your starting balance is <strong>0 Z</strong>.

        </div>


        <div
            class="message"
            id="message"
        ></div>


        <div class="login">

            Already have a wallet?

            <span onclick="goLogin()">
                Login
            </span>

        </div>

    </div>


    <div class="bd">
        <span class="flag"></span>
        Bangladesh
    </div>

</div>


<script>

const SUPABASE_URL =
    "https://dvipyqihaxcdpahzipb.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_OekqwQUbrFPSNhHn-w-K4g_hnUmxOeD";


const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function continueWithGoogle() {

    const message =
        document.getElementById("message");

    message.style.display = "block";

    message.textContent =
        "Opening Google login...";


    const { error } =
        await db.auth.signInWithOAuth({

            provider: "google",

            options: {

                redirectTo:
                    window.location.origin +
                    "/zizz-wallet/dashboard.html"

            }

        });


    if (error) {

        message.textContent =
            error.message;

    }

}


function goLogin() {

    window.location.href =
        "login.html";

}

</script>

</body>
</html>
