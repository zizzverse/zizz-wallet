<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZIZZ Wallet - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #06110d;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(145deg, #d8b45a, #8d671c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: #06110d;
            box-shadow: 0 0 35px rgba(216, 180, 90, 0.25);
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #91a59b;
            margin-bottom: 30px;
        }

        .card {
            background: #0d1b15;
            border: 1px solid #1d3429;
            border-radius: 22px;
            padding: 24px;
        }

        label {
            display: block;
            color: #b9c8c0;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 52px;
            background: #07130e;
            border: 1px solid #294437;
            border-radius: 13px;
            color: white;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #d8b45a;
        }

        .login-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #d8b45a, #a87d24);
            color: #08100c;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: #667970;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #263a31;
            flex: 1;
        }

        .google-btn {
            width: 100%;
            height: 52px;
            border-radius: 13px;
            border: 1px solid #30483c;
            background: #101f18;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .signup {
            text-align: center;
            margin-top: 22px;
            color: #8fa198;
            font-size: 14px;
        }

        .signup span {
            color: #d8b45a;
            cursor: pointer;
        }

        .bd {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #71867c;
        }

        .flag {
            display: inline-block;
            width: 22px;
            height: 14px;
            background: #006a4e;
            position: relative;
            margin-right: 5px;
            vertical-align: -2px;
        }

        .flag::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: #f42a41;
            border-radius: 50%;
            left: 7px;
            top: 3px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">Z</div>

    <h1>ZIZZ Wallet</h1>
    <p class="subtitle">Secure your digital ZIZZ Coins</p>

    <div class="card">

        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="+880 1XXXXXXXXX"
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >

        <button class="login-btn" onclick="login()">
            Login
        </button>

        <div class="divider">
            OR
        </div>

        <button class="google-btn" onclick="googleLogin()">
            🔵 Continue with Google
        </button>

        <div class="signup">
            Don't have an account?
            <span onclick="signup()">
                Create Account
            </span>
        </div>

    </div>
