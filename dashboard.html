<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZIZZ Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#020b07;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:90px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:30px 20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
    font-size:28px;
    font-weight:bold;
}

.logo-icon{
    width:72px;
    height:72px;
    border-radius:50%;
    background:#d7aa3b;
    color:#050505;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    font-weight:bold;
}

.country{
    border:1px solid #29463b;
    border-radius:40px;
    padding:12px 22px;
    font-size:18px;
}

.welcome{
    margin-top:65px;
    color:#91a49d;
    font-size:22px;
}

.username{
    margin-top:8px;
    font-size:48px;
}

.balance{
    margin-top:55px;
    background:linear-gradient(135deg,#123b29,#092419);
    border:1px solid #416d55;
    border-radius:40px;
    padding:50px;
    position:relative;
    overflow:hidden;
}

.balance h3{
    color:#aabcb5;
    font-size:24px;
    font-weight:normal;
}

.amount{
    margin-top:25px;
    font-size:65px;
    font-weight:bold;
}

.amount span{
    color:#d7aa3b;
    font-size:30px;
}

.actions{
    display:flex;
    gap:20px;
    margin-top:35px;
}

.action{
    flex:1;
    padding:25px;
    border-radius:30px;
    border:1px solid #29463b;
    background:#071810;
    color:white;
    font-size:24px;
    font-weight:bold;
}

.send{
    background:#d7aa3b;
    color:#111;
    border:none;
}

.section-title{
    margin-top:50px;
    font-size:30px;
}

.wallet-card{
    margin-top:25px;
    padding:30px;
    border-radius:30px;
    background:#071810;
    border:1px solid #29463b;
}

.wallet-label{
    color:#91a49d;
    font-size:18px;
}

.wallet-id{
    color:#d7aa3b;
    font-size:25px;
    font-weight:bold;
    margin-top:18px;
    word-break:break-all;
}

.copy{
    margin-top:18px;
    background:#123021;
    color:#d7aa3b;
    border:none;
    padding:12px 22px;
    border-radius:15px;
}

.transaction{
    margin-top:15px;
    padding:20px;
    border-bottom:1px solid #1c3028;
}

.transaction-top{
    display:flex;
    justify-content:space-between;
}

.green{
    color:#55d98b;
}

.red{
    color:#ff7070;
}

.empty{
    color:#71827b;
    padding:25px 0;
}

.nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:85px;
    background:#020b07;
    border-top:1px solid #1c3028;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav button{
    background:none;
    border:none;
    color:#89958f;
    font-size:15px;
}

.nav button:first-child{
    color:#d7aa3b;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
}

.modal-box{
    width:100%;
    max-width:430px;
    background:#0b1711;
    border:1px solid #29463b;
    border-radius:25px;
    padding:25px;
}

.modal-box h2{
    margin-bottom:20px;
}

.modal-box input{
    width:100%;
    padding:16px;
    margin-top:12px;
    border-radius:12px;
    border:1px solid #29463b;
    background:#020b07;
    color:white;
    font-size:16px;
}

.modal-box button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border-radius:12px;
    border:none;
    font-size:17px;
    font-weight:bold;
}

.confirm{
    background:#d7aa3b;
    color:#111;
}

.cancel{
    background:#16261e;
    color:white;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#17231d;
    color:#bbb;
    display:none;
}

@media(max-width:500px){

    .container{
        padding:25px 18px;
    }

    .logo{
        font-size:23px;
    }

    .logo-icon{
        width:60px;
        height:60px;
        font-size:35px;
    }

    .country{
        padding:10px 15px;
    }

    .username{
        font-size:42px;
    }

    .balance{
        padding:35px 28px;
    }

    .amount{
        font-size:55px;
    }

    .actions{
        gap:10px;
    }

    .action{
        padding:22px 10px;
        font-size:19px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            <div class="logo-icon">Z</div>
            ZIZZ WALLET
        </div>

        <div class="country">
            🇧🇩 BD
        </div>

    </div>


    <div class="welcome">
        Welcome back 👋
    </div>

    <div class="username" id="username">
        ZIZZ User
    </div>


    <div class="balance">

        <h3>Available ZIZZ Coin</h3>

        <div class="amount">
            <span id="balance">0</span>
            <span>Z</span>
        </div>

    </div>


    <div class="actions">

        <button class="action send" onclick="openSend()">
            ↗ Send
        </button>

        <button class="action" onclick="openReceive()">
            ↙ Receive
        </button>

    </div>


    <h2 class="section-title">
        My Wallet
    </h2>

    <div class="wallet-card">

        <div class="wallet-label">
            ZIZZ Wallet ID
        </div>

        <div class="wallet-id" id="walletId">
            Loading...
        </div>

        <button class="copy" onclick="copyWallet()">
            Copy
        </button>

    </div>


    <h2 class="section-title">
        Recent Transactions
    </h2>

    <div id="transactions">
        <div class="empty">
            Loading transactions...
        </div>
    </div>

</div>


<!-- SEND MODAL -->

<div class="modal" id="sendModal">

    <div class="modal-box">

        <h2>Send ZIZZ Coin</h2>

        <input
            id="receiver"
            type="text"
            placeholder="Receiver Wallet ID"
        >

        <input
            id="sendAmount"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="Amount"
        >

        <div id="sendMessage" class="message"></div>

        <button class="confirm" onclick="sendCoin()">
            Send ZIZZ Coin
        </button>

        <button class="cancel" onclick="closeSend()">
            Cancel
        </button>

    </div>

</div>


<!-- RECEIVE MODAL -->

<div class="modal" id="receiveModal">

    <div class="modal-box">

        <h2>Receive ZIZZ Coin</h2>

        <p style="color:#9aa9a2;margin-bottom:10px;">
            Send this Wallet ID to another ZIZZ user:
        </p>

        <div
            id="receiveWallet"
            class="wallet-id"
        >
            Loading...
        </div>

        <button class="copy" onclick="copyWallet()">
            Copy Wallet ID
        </button>

        <button class="cancel" onclick="closeReceive()">
            Close
        </button>

    </div>

</div>


<div class="nav">

    <button>⌂<br>Home</button>

    <button onclick="openSend()">↗<br>Send</button>

    <button onclick="openReceive()">↙<br>Receive</button>

    <button onclick="logout()">👤<br>Logout</button>

</div>


<script>

const SUPABASE_URL =
"https://dwipyqihaxcdpahzirpb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OekqwQUbrFPSNhHn-w-K4g_hnUmxOeD";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;
let currentWallet = null;


/* =========================
   LOAD WALLET
========================= */

async function loadWallet(){

    const {
        data: {
            session
        }
    } = await db.auth.getSession();


    if(!session){

        window.location.href =
            "auth/login.html";

        return;
    }


    currentUser = session.user;


    const {
        data: profile,
        error: profileError
    } = await db
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .single();


    if(profileError){

        console.log(profileError);

    }


    const {
        data: wallet,
        error: walletError
    } = await db
        .from("wallets")
        .select("*")
        .eq("user_id", currentUser.id)
        .single();


    if(walletError){

        console.log(walletError);

        document.getElementById("walletId")
            .innerText = "Wallet not found";

        return;
    }


    currentWallet = wallet;


    const name =
        currentUser.user_metadata?.full_name ||
        currentUser.user_metadata?.name ||
        profile?.full_name ||
        "ZIZZ User";


    document.getElementById("username")
        .innerText = name;


    document.getElementById("balance")
        .innerText =
        Number(wallet.balance || 0)
        .toLocaleString();


    document.getElementById("walletId")
        .innerText =
        wallet.wallet_id;


    document.getElementById("receiveWallet")
        .innerText =
        wallet.wallet_id;


    loadTransactions();
}


/* =========================
   TRANSACTIONS
========================= */

async function loadTransactions(){

    const box =
        document.getElementById("transactions");


    const {
        data,
        error
    } = await db
        .from("transactions")
        .select("*")
        .or(
            "sender_wallet_id.eq." +
            currentWallet.wallet_id +
            ",receiver_wallet_id.eq." +
            currentWallet.wallet_id
        )
        .order("created_at", {
            ascending:false
        })
        .limit(10);


    if(error){

        console.log(error);

        box.innerHTML =
            `<div class="empty">
                No transactions yet.
             </div>`;

        return;
    }


    if(!data || data.length === 0){

        box.innerHTML =
            `<div class="empty">
                No transactions yet.
             </div>`;

        return;
    }


    box.innerHTML = "";


    data.forEach(tx => {

        const isSent =
            tx.sender_wallet_id ===
            currentWallet.wallet_id;
