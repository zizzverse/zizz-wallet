<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#07130f">

    <title>ZIZZ Wallet</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top right, #123b2b 0%, transparent 35%),
                #070b09;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        button {
            font: inherit;
            border: none;
            cursor: pointer;
        }

        /* HEADER */

        .header {
            height: 70px;
            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(7, 11, 9, 0.8);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(145deg, #f5d76e, #c69b28);

            color: #07130f;

            font-size: 23px;
            font-weight: 900;

            box-shadow:
                0 0 20px rgba(224,185,67,0.2);
        }

        .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .country {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 8px 11px;

            background: #111a15;
            border: 1px solid #23332a;

            border-radius: 12px;

            font-size: 13px;
        }

        .bd-flag {
            width: 22px;
            height: 15px;

            background: #006a4e;

            border-radius: 2px;

            position: relative;

            overflow: hidden;
        }

        .bd-flag::after {
            content: "";

            position: absolute;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #f42a41;

            left: 6px;
            top: 3px;
        }

        /* MAIN */

        .container {
            max-width: 650px;
            margin: auto;
            padding: 24px 18px;
        }

        .welcome {
            margin-bottom: 20px;
        }

        .welcome p {
            color: #84968d;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .welcome h1 {
            font-size: 26px;
        }

        /* BALANCE CARD */

        .balance-card {
            position: relative;
            overflow: hidden;

            padding: 25px;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    #173e2e,
                    #0d2119
                );

            border: 1px solid rgba(245,215,110,0.18);

            box-shadow:
                0 18px 45px rgba(0,0,0,0.35);
        }

        .balance-card::before {
            content: "Z";

            position: absolute;

            right: -15px;
            top: -35px;

            font-size: 180px;
            font-weight: 900;

            color: rgba(255,255,255,0.035);

            transform: rotate(-15deg);
        }

        .balance-top {
            display: flex;
            align-items: center;
            gap: 12px;

            position: relative;
            z-index: 1;
        }

        .coin-logo {
            width: 48px;
            height: 48px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #ffe994,
                    #c79a25
                );

            color: #142117;

            font-size: 26px;
            font-weight: 900;

            box-shadow:
                inset 0 2px 5px rgba(255,255,255,0.5),
                0 5px 18px rgba(0,0,0,0.25);
        }

        .coin-name {
            font-size: 14px;
            color: #b7c8c0;
        }

        .coin-symbol {
            font-size: 11px;
            color: #70867a;
            margin-top: 3px;
        }

        .balance {
            position: relative;
            z-index: 1;

            margin-top: 24px;
        }

        .balance small {
            color: #91a79b;
            font-size: 12px;
        }

        .balance h2 {
            font-size: 38px;
            margin-top: 7px;

            letter-spacing: -1px;
        }

        .balance h2 span {
            color: #e7c85b;
            font-size: 18px;
        }

        /* ACTIONS */

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 16px;
        }

        .action {
            height: 58px;

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 9px;

            font-weight: 700;

            background: #121b16;

            color: white;

            border: 1px solid #26372e;
        }

        .action.primary {
            background: #e7c85b;
            color: #10150f;
            border-color: #e7c85b;
        }

        .action:active {
            transform: scale(0.97);
        }

        /* BUY */

        .buy-card {
            margin-top: 18px;

            padding: 18px;

            border-radius: 19px;

            background: #111914;

            border: 1px solid #223128;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .buy-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .buy-icon {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #1c2c23;

            border-radius: 13px;

            font-size: 21px;
        }

        .buy-info strong {
            font-size: 14px;
        }

        .buy-info small {
            display: block;

            color: #778980;

            margin-top: 4px;

            font-size: 11px;
        }

        .buy-btn {
            padding: 11px 16px;

            border-radius: 11px;

            background: #e7c85b;

            color: #10150f;

            font-weight: 800;

            font-size: 12px;
        }

        /* TRANSACTIONS */

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 28px 2px 13px;
        }

        .section-title h2 {
            font-size: 17px;
        }

        .section-title button {
            background: transparent;
            color: #e7c85b;
            font-size: 12px;
        }

        .transaction {
            padding: 15px;

            background: #111713;

            border: 1px solid #202c25;

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 9px;
        }

        .transaction-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transaction-icon {
            width: 40px;
            height: 40px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #1a2921;
        }

        .transaction strong {
            display: block;
            font-size: 13px;
        }

        .transaction small {
            display: block;

            color: #718078;

            font-size: 10px;

            margin-top: 4px;
        }

        .received {
            color: #63d69b;
            font-size: 13px;
            font-weight: 700;
        }

        .sent {
            color: #ff7373;
            font-size: 13px;
            font-weight: 700;
        }

        /* BOTTOM NAV */

        .bottom-nav {
            position: fixed;

            bottom: 0;
            left: 0;

            width: 100%;
            height: 76px;

            background: rgba(10,15,12,0.95);

            backdrop-filter: blur(18px);

            border-top: 1px solid #202c25;

            display: flex;
            align-items: center;
            justify-content: space-around;

            z-index: 20;
        }

        .nav-item {
            background: transparent;

            color: #65756d;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 5px;

            font-size: 19px;
        }

        .nav-item span {
            font-size: 9px;
        }

        .nav-item.active {
            color: #e7c85b;
        }

        @media (min-width: 700px) {

            .bottom-nav {
                max-width: 650px;

                left: 50%;

                transform: translateX(-50%);

                border-radius: 20px 20px 0 0;
            }
        }

    </style>
</head>


<body>


<header class="header">

    <div class="brand">

        <div class="brand-logo">
            Z
        </div>

        <div class="brand-name">
            ZIZZ WALLET
        </div>

    </div>


    <div class="country">

        <div class="bd-flag"></div>

        BD

    </div>

</header>



<main class="container">


    <section class="welcome">

        <p>Welcome back</p>

        <h1>Your Wallet</h1>

    </section>



    <!-- BALANCE -->

    <section class="balance-card">


        <div class="balance-top">
